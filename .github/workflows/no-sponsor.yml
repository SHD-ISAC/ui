name: No-Sponsor Linux Release
on:
  push:
    branches: [no-sponsor]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".nvmrc"
      - "frontend/**"
      - ".github/workflows/no-sponsor.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: no-sponsor-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test opt-out
        env:
          CGO_ENABLED: "1"
        run: go test -shuffle=on -count=1 ./internal/config ./internal/web/service/panel
      - name: Build static linux-amd64
        env:
          CGO_ENABLED: "1"
          CC: musl-gcc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          go build -trimpath -buildvcs=true \
            -ldflags="-w -s -linkmode external -extldflags '-static' -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA:0:8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o x-ui .
          test -x x-ui
          if readelf -l x-ui | grep -q INTERP; then
            echo "Binary is dynamically linked; refusing to publish" >&2
            exit 1
          fi
          tar -czf x-ui-linux-amd64.tar.gz x-ui
          sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256
      - name: Publish immutable no-sponsor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="no-sponsor-${GITHUB_SHA}"
          short="${GITHUB_SHA:0:8}"
          notes="Build from no-sponsor commit ${GITHUB_SHA}. Binary-only; Xray and existing config are not changed. Opt out using XUI_DISABLE_SPONSOR=true."
          # Never move published tags. Protected tags may be created, but not rewritten.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            # Re-runs for an existing immutable commit should not mutate its release.
            echo "Release ${tag} already exists; leaving immutable assets unchanged"
          else
            gh release create "${tag}" x-ui-linux-amd64.tar.gz x-ui-linux-amd64.tar.gz.sha256 \
              --target "${GITHUB_SHA}" --prerelease --latest=false \
              --title "No-Sponsor ${short}" --notes "${notes}"
          fi
